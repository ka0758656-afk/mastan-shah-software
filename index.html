
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastan Shah Software</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2f7;color:#172033}
header{background:#123b69;color:white;padding:16px}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 6px #0001}
input,select,button,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #ccd5e0;border-radius:7px;font-size:15px}
button{background:#1769aa;color:white;border:0;font-weight:bold}
nav{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.hidden{display:none}
.small{font-size:12px;color:#64748b}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.tablebox{overflow:auto}
@media(min-width:700px){nav{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h2>Mastan Shah Software</h2>
<div>Accounts • Stock • Godam • Payments • Reports</div>
</header>
<main>
<section id="login" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Supabase Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage" class="small"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<span id="userInfo"></span>
<button onclick="logout()">Logout</button>
</div>

<nav>
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('customers')">Customers</button>
<button onclick="showPage('suppliers')">Suppliers</button>
<button onclick="showPage('items')">Stock Items</button>
<button onclick="showPage('godams')">Godams</button>
<button onclick="showPage('invoice')">Sale / Purchase</button>
<button onclick="showPage('payments')">Payments</button>
<button onclick="showPage('partyLedger')">Party Ledger</button>
<button onclick="showPage('stockLedger')">Stock Ledger</button>
<button onclick="showPage('cashLedger')">Cash Ledger</button>
<button onclick="showPage('exchange')">USD / AFN</button>
<button onclick="showPage('reports')">Reports / Print</button>
</nav>

<div id="content" class="card">Loading...</div>
</section>
</main>

<script>
const SUPABASE_URL="https://mcvahsaxynfgmcjkhdku.supabase.co";
const SUPABASE_KEY="sb_publishable_pX8Jn58bNOn_Lpf2DOoBHA_78MuE6yB";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentPage="dashboard";

const $=id=>document.getElementById(id);
const v=id=>($(id)?.value||"").trim();
const safe=x=>String(x??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const cash=n=>Number(n||0).toLocaleString();

function errorMessage(e){alert(e.message||String(e))}
function task(fn){fn().catch(errorMessage)}
function currencySelect(id="currency"){
return `<select id="${id}">
<option>PKR</option><option>AFN</option><option>USD</option>
</select>`;
}
function input(id,label,type="text"){
return `<label>${label}<input id="${id}" type="${type}"></label>`;
}
function selectBox(id,label,items){
return `<label>${label}<select id="${id}">${
items.map(x=>`<option value="${safe(x.id)}">${safe(x.name)}</option>`).join("")
}</select></label>`;
}
async function login(){
$("loginMessage").textContent="Logging in...";
const {error}=await db.auth.signInWithPassword({
email:v("email"),password:v("password")
});
if(error){$("loginMessage").textContent=error.message;return}
await checkSession();
}
async function logout(){
await db.auth.signOut();
await checkSession();
}
async function checkSession(){
const {data,error}=await db.auth.getSession();
if(error)throw error;
currentUser=data.session?.user||null;
$("login").classList.toggle("hidden",!!currentUser);
$("app").classList.toggle("hidden",!currentUser);
if(currentUser){
$("userInfo").textContent="Logged in: "+currentUser.email;
await showPage(currentPage);
}
}
db.auth.onAuthStateChange(()=>setTimeout(()=>checkSession().catch(errorMessage),0));

async function getRows(table,order="created_at"){
let q=db.from(table).select("*");
if(order)q=q.order(order,{ascending:false});
const {data,error}=await q;
if(error)throw error;
return data||[];
}
async function addRecord(table,record){
const {error}=await db.from(table).insert(record);
if(error)throw error;
}
function renderList(items){
if(!items.length)return "<p>No records found.</p>";
return items.map(x=>`<div style="padding:10px;border-bottom:1px solid #ddd">
<b>${safe(x.name||x.invoice_number||x.id)}</b>
<div class="small">${safe(x.phone||x.address||"")}</div>
</div>`).join("");
}
async function showPage(page){
currentPage=page;
const c=$("content");
c.innerHTML="Loading...";
try{
if(page==="dashboard"){
const [a,b,d,g,i,m]=await Promise.all([
getRows("customers"),getRows("suppliers"),getRows("stock_items"),
getRows("godowns"),getRows("invoices"),getRows("stock_movements")
]);
c.innerHTML=`<h3>Dashboard</h3><div class="grid">
${stat("Customers",a.length)}
${stat("Suppliers",b.length)}
${stat("Stock Items",d.length)}
${stat("Godams",g.length)}
${stat("Invoices",i.length)}
${stat("Stock Movements",m.length)}
</div><p class="small">Existing records are read from Supabase.</p>`;
}
if(page==="customers"||page==="suppliers"){
const table=page;
c.innerHTML=`<h3>${page}</h3>
${input("name","Name")}
${input("phone","Phone")}
${input("address","Address")}
${input("opening","Opening Balance","number")}
${currencySelect()}
<button onclick="task(saveParty)">Save ${page==="customers"?"Customer":"Supplier"}</button>
<input id="filter" placeholder="Search..." oninput="task(loadPartyList)">
<div id="list"></div>`;
window.partyTable=table;
await loadPartyList();
}
if(page==="items"){
c.innerHTML=`<h3>Stock Items</h3>
${input("itemName","Item Name")}
${input("unit","Unit (piece / box)")}
<button onclick="task(saveItem)">Save Item</button>
<div id="list"></div>`;
$("list").innerHTML=renderList(await getRows("stock_items"));
}
if(page==="godams"){
c.innerHTML=`<h3>Godams</h3>
${input("godamName","Godam Name")}
<button onclick="task(saveGodam)">Save Godam</button>
<div id="list"></div>`;
$("list").innerHTML=renderList(await getRows("godowns"));
}
if(page==="invoice"){
const [customers,suppliers,items,godams]=await Promise.all([
getRows("customers"),getRows("suppliers"),
getRows("stock_items"),getRows("godowns")
]);
c.innerHTML=`<h3>Sale / Purchase Invoice</h3>
<label>Type<select id="type" onchange="changePartyOptions()">
<option value="sale">Sale</option>
<option value="purchase">Purchase</option></select></label>
${input("invoiceNo","Invoice Number")}
<div id="partyOptions"></div>
${selectBox("itemId","Item",items)}
${selectBox("godamId","Source / Destination Godam",godams)}
${input("qty","Quantity","number")}
${input("price","Unit Price","number")}
${currencySelect("invCurrency")}
${input("invoiceDate","Date","date")}
<button onclick="task(saveInvoice)">Save Invoice</button>
<p class="small">Invoice steps use separate database requests. A failure can leave a partial invoice. Test first.</p>`;
window.invoiceCustomers=customers;
window.invoiceSuppliers=suppliers;
changePartyOptions();
}
if(page==="payments"){
const [customers,suppliers]=await Promise.all([
getRows("customers"),getRows("suppliers")
]);
window.paymentCustomers=customers;
window.paymentSuppliers=suppliers;
c.innerHTML=`<h3>Payments In / Out</h3>
<label>Party Type<select id="partyType" onchange="changePaymentOptions()">
<option value="customer">Customer</option>
<option value="supplier">Supplier</option></select></label>
<div id="paymentParty"></div>
<label>Direction<select id="direction">
<option value="received">Received</option><option value="paid">Paid</option>
</select></label>
${input("amount","Amount","number")}
${currencySelect("payCurrency")}
${input("payDetails","Reference / Details")}
${input("payDate","Date","date")}
<button onclick="task(savePayment)">Save Payment</button>`;
changePaymentOptions();
}
if(page==="partyLedger"){
const [entries,customers,suppliers]=await Promise.all([
getRows("party_ledger_entries"),getRows("customers"),getRows("suppliers")
]);
const names={};
customers.forEach(x=>names["customer:"+x.id]=x.name);
suppliers.forEach(x=>names["supplier:"+x.id]=x.name);
c.innerHTML=`<h3>Party Ledger</h3><input id="ledgerSearch" placeholder="Search party..." oninput="task(loadPartyLedger)"><div id="list"></div>`;
window.ledgerEntries=entries.map(x=>({...x,partyName:names[x.party_type+":"+x.party_id]||x.party_id}));
loadPartyLedger();
}
if(page==="stockLedger"){
const [moves,items,godams]=await Promise.all([
getRows("stock_movements"),getRows("stock_items"),getRows("godowns")
]);
const im=Object.fromEntries(items.map(x=>[x.id,x.name]));
const gm=Object.fromEntries(godams.map(x=>[x.id,x.name]));
c.innerHTML=`<h3>Stock Movement Ledger</h3><div class="tablebox"><table>
<tr><th>Date</th><th>Godam</th><th>Item</th><th>Movement</th><th>Qty</th></tr>
${moves.map(x=>`<tr><td>${safe(x.created_at||"")}</td>
<td>${safe(gm[x.godown_id]||x.godown_id)}</td>
<td>${safe(im[x.item_id]||x.item_id)}</td>
<td>${safe(x.movement_type)}</td><td>${cash(x.quantity)}</td></tr>`).join("")}
</table></div>`;
}
if(page==="cashLedger"){
const d=await getRows("cash_movements","movement_date");
c.innerHTML=`<h3>Cash Ledger</h3><div class="tablebox"><table>
<tr><th>Date</th><th>Currency</th><th>Type</th><th>Amount</th><th>Reference</th></tr>
${d.map(x=>`<tr><td>${safe(x.movement_date||"")}</td>
<td>${safe(x.currency||"")}</td><td>${safe(x.movement_type||"")}</td>
<td>${cash(x.amount)}</td><td>${safe(x.reference||"")}</td></tr>`).join("")}
</table></div>`;
}
if(page==="exchange"){
c.innerHTML=`<h3>USD / AFN Exchange</h3>
<label>Direction<select id="exchangeDirection">
<option value="USD_AFN">USD to AFN</option>
<option value="AFN_USD">AFN to USD</option></select></label>
${input("exchangeAmount","Amount","number")}
${input("exchangeRate","Rate (AFN per USD)","number")}
${input("exchangeRef","Details")}
<button onclick="task(saveExchange)">Save Exchange</button>`;
}
if(page==="reports"){
const [a,b,d,e,f,g]=await Promise.all([
getRows("invoices"),getRows("customers"),getRows("suppliers"),
getRows("stock_items"),getRows("cash_movements"),getRows("stock_movements")
]);
c.innerHTML=`<h3>Reports</h3><div class="grid">
${stat("Invoices",a.length)}${stat("Customers",b.length)}
${stat("Suppliers",d.length)}${stat("Stock Items",e.length)}
${stat("Cash Movements",f.length)}${stat("Stock Movements",g.length)}
</div><button onclick="window.print()">Print / Save PDF</button>
<p class="small">Counts are not a verified profit-and-loss report.</p>`;
}
}catch(e){
c.innerHTML=`<h3>Database Error</h3><p>${safe(e.message||e)}</p>
<p class="small">Check the existing table/column names and Supabase access policies. No tables were reset.</p>`;
}
}
function stat(label,n){return `<div class="card"><div>${safe(label)}</div><h2>${safe(n)}</h2></div>`}
async function saveParty(){
if(!v("name"))throw Error("Name is required");
await addRecord(window.partyTable,{
name:v("name"),phone:v("phone")||null,address:v("address")||null,
opening_balance:Number(v("opening")||0),currency:v("currency")
});
alert("Saved");await showPage(currentPage);
}
async function loadPartyList(){
const d=await getRows(window.partyTable);
const term=(v("filter")||"").toLowerCase();
$("list").innerHTML=renderList(d.filter(x=>JSON.stringify(x).toLowerCase().includes(term)));
}
async function saveItem(){
if(!v("itemName"))throw Error("Item name is required");
await addRecord("stock_items",{name:v("itemName"),unit:v("unit")||"piece"});
alert("Saved");await showPage("items");
}
async function saveGodam(){
if(!v("godamName"))throw Error("Godam name is required");
await addRecord("godowns",{name:v("godamName")});
alert("Saved");await showPage("godams");
}
function changePartyOptions(){
const list=v("type")==="sale"?window.invoiceCustomers:window.invoiceSuppliers;
$("partyOptions").innerHTML=selectBox("partyId","Party",list||[]);
}
function changePaymentOptions(){
const list=v("partyType")==="customer"?window.paymentCustomers:window.paymentSuppliers;
$("paymentParty").innerHTML=selectBox("paymentPartyId","Party",list||[]);
}
async function saveInvoice(){
const type=v("type"),qty=Number(v("qty")),price=Number(v("price"));
if(!v("partyId")||!v("itemId")||!v("godamId"))throw Error("Select party, item and godam.");
if(qty<=0||price<0||!Number.isFinite(qty)||!Number.isFinite(price))throw Error("Invalid quantity or price.");
const partyTable=type==="sale"?"customers":"suppliers";
const {data:party,error:pe}=await db.from(partyTable).select("*").eq("id",v("partyId")).single();
if(pe)throw pe;
if(type==="sale"){
const {data:moves,error:me}=await db.from("stock_movements").select("*").eq("item_id",v("itemId")).eq("godown_id",v("godamId"));
if(me)throw me;
const balance=(moves||[]).reduce((s,x)=>s+(x.movement_type==="in"?Number(x.quantity):x.movement_type==="out"?-Number(x.quantity):0),0);
if(balance<qty)throw Error("Insufficient recorded stock. Available: "+balance);
}
const total=qty*price;
const {data:inv,error:ie}=await db.from("invoices").insert({
invoice_type:type,invoice_number:v("invoiceNo")||null,party_name:party.name,
godown_id:v("godamId"),invoice_date:v("invoiceDate")||new Date().toISOString().slice(0,10),
currency:v("invCurrency"),total
}).select().single();
if(ie)throw ie;
await addRecord("invoice_lines",{invoice_id:inv.id,item_id:v("itemId"),quantity:qty,unit_price:price});
await addRecord("stock_movements",{item_id:v("itemId"),godown_id:v("godamId"),movement_type:type==="sale"?"out":"in",quantity:qty,reference:v("invoiceNo")||inv.id});
await addRecord("party_ledger_entries",{party_type:type==="sale"?"customer":"supplier",party_id:party.id,entry_type:type,amount:total,currency:v("invCurrency"),details:"Invoice "+(v("invoiceNo")||inv.id)});
alert("Invoice saved. Verify all linked records.");await showPage("invoice");
}
async function savePayment(){
const amount=Number(v("amount"));
if(amount<=0||!v("paymentPartyId"))throw Error("Enter amount and select party.");
const received=v("direction")==="received";
const pt=v("partyType");
await addRecord("party_ledger_entries",{
party_type:pt,party_id:v("paymentPartyId"),
entry_type:received?"payment_received":"payment_paid",
amount,currency:v("payCurrency"),details:v("payDetails")||"Payment"
});
await addRecord("cash_movements",{
currency:v("payCurrency"),movement_type:received?"in":"out",
amount,reference:v("payDetails")||"Party payment",
movement_date:v("payDate")||new Date().toISOString().slice(0,10)
});
alert("Payment saved. Verify both ledgers.");await showPage("payments");
}
async function saveExchange(){
const amount=Number(v("exchangeAmount")),rate=Number(v("exchangeRate"));
if(amount<=0||rate<=0)throw Error("Enter valid amount and rate.");
const dir=v("exchangeDirection");
const usd=dir==="USD_AFN"?amount:amount/rate;
const afn=dir==="USD_AFN"?amount*rate:amount;
const ref=v("exchangeRef")||"Currency exchange";
await addRecord("cash_movements",[
{currency:"USD",movement_type:"out",amount:usd,reference:ref+" USD"},
{currency:"AFN",movement_type:"in",amount:afn,reference:ref+" AFN"}
]);
alert("Exchange saved");await showPage("exchange");
}
async function loadPartyLedger(){
const term=(v("ledgerSearch")||"").toLowerCase();
const data=(window.ledgerEntries||[]).filter(x=>String(x.partyName).toLowerCase().includes(term));
$("list").innerHTML=`<div class="tablebox"><table>
<tr><th>Date</th><th>Party</th><th>Entry</th><th>Amount</th><th>Currency</th><th>Details</th></tr>
${data.map(x=>`<tr><td>${safe(x.created_at||"")}</td><td>${safe(x.partyName)}</td>
<td>${safe(x.entry_type)}</td><td>${cash(x.amount)}</td>
<td>${safe(x.currency||"")}</td><td>${safe(x.details||"")}</td></tr>`).join("")}
</table></div>`;
}
checkSession().catch(errorMessage);
</script>
</body>
</html>
